name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar backend
        run: pip install -r backend/requirements.txt
      - name: Testar backend
        run: python backend/manage.py test core -v 2
      - name: Validar backend para produção
        env:
          DEBUG: "False"
          SECRET_KEY: ci-production-check-key-abcdefghijklmnopqrstuvwxyz-0123456789
          ALLOWED_HOSTS: example.test
          CORS_ALLOWED_ORIGINS: https://example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
        run: |
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py check --deploy
          python -m pip check
      - name: Preparar banco E2E
        run: python backend/manage.py migrate && python backend/manage.py seed_catalog && python backend/manage.py prepare_e2e
      - name: Iniciar API
        run: python backend/manage.py runserver 127.0.0.1:8000 --noreload &

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Lint e build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm audit --omit=dev
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        working-directory: frontend
        run: npm run test:e2e
