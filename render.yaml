databases:
  - name: pesque-pague-db
    plan: free
    databaseName: pesquepague
    user: pesquepague
    ipAllowList: []

services:
  - type: web
    name: pesque-pague-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn pescapague.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: ALLOWED_HOSTS
        value: pesque-pague-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://pesque-pague-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pesque-pague-web.onrender.com
      - key: GOOGLE_ALLOWED_ORIGINS
        value: https://pesque-pague-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pesque-pague-db
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_URL
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ORDERS_FEATURE_ENABLED
        value: "True"
      - key: ONLINE_PAYMENTS_ENABLED
        value: "False"

  - type: web
    name: pesque-pague-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://pesque-pague-api.onrender.com https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    routes:
      - type: rewrite
        source: /imprimir/comanda/*
        destination: /imprimir/comanda/index.html
      - type: rewrite
        source: /imprimir/pesca/*
        destination: /imprimir/pesca/index.html
    envVars:
      - key: VITE_API_URL
        value: https://pesque-pague-api.onrender.com/api
      - key: VITE_SITE_URL
        value: https://pesque-pague-web.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_AUTH_ENDPOINT
        value: /auth/google/
      - key: VITE_ONLINE_PAYMENTS_ENABLED
        value: "false"
