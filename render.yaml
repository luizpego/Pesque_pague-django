services:
  - type: web
    name: pesque-pague-api
    env: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn pescapague.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: pesque-pague-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://pesque-pague-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pesque-pague-db
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: pesque-pague-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pesque-pague-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_AUTH_ENDPOINT
        value: /auth/google/

databases:
  - name: pesque-pague-db
    databaseName: pesquepague
    user: pesquepague
